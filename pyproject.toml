[project]
name = "rtool"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Arpan Singh", email = "arpansingh6944@gmail.com.com" }
]
requires-python = ">=3.14"
dependencies = [
    "arxiv<4",
    "bs4>=0.0.2",
    "chromadb>=1.5.9",
    "ddgs>=9.16.1",
    "duckdb>=2.0.0",
    "duckduckgo-search>=8.1.1",
    "faiss-cpu>=1.16.0",
    "huggingface-hub>=1.33.0",
    "ipykernel>=7.4.0",
    "langchain>=1.5.0",
    "langchain-chroma>=1.1.0",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.7.4",
    "langchain-text-splitters>=1.1.3",
    "langsmith>=0.14.17",
    "mysql-connector-python>=26.10.0",
    "numexpr>=2.14.2",
    "openai>=3.49.0",
    "pandas>=3.1.1",
    "pymupdf>=2.1",
    "pypdf>=7.0.1",
    "python-dotenv>=1.2.4",
    "pytube>=15.0.0",
    "sentence-transformers>=6.3.0",
    "sqlalchemy>=2.1.8",
    "streamlit>=1.67.0",
    "unstructured>=0.27.37",
    "validators==0.28.1",
    "wikipedia>=1.4.0",
    "youtube-transcript-api>=1.2.5",
]

[project.scripts]
rtool = "rtool:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
